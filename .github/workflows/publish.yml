# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    tags:
      - 'v*'       # Run the workflow when pushing to the main branch

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_INSTALL_DIR: "./.dotnet"
  NUGGETDIRECTORY: ${{github.workspace}}/nuget
  PROJECT_PATH: EntityFrameworkToolKit
  NUGGET_SOURCE: https://nuget.pkg.github.com/wearemiew/index.json

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer
    
    # Store the version, stripping any v-prefix
    - name: Write release version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo Version: $VERSION
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    # Use version in other step
    - name: Read version
      run: | 
        echo Version now: ${VERSION}
    
    # Create the NuGet package in the folder from the environment variable NuGetDirectory
        # Install the .NET SDK indicated in the global.json file
    - name: Download .net
      uses: actions/setup-dotnet@v3

    - name: Pack nugget package
      run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release -p:PackageVersion=${VERSION} --output ${{env.NUGGETDIRECTORY}}

    - name: Publish NuGet package
      run: dotnet nuget push ${{env.NUGGETDIRECTORY}}/*.nupkg -k ${GITHUB_TOKEN} -s ${{env.NUGGET_SOURCE}}  --no-symbols 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}