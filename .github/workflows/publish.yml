# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_INSTALL_DIR: "./.dotnet"
  NuGetDirectory: ${{github.workspace}}/nuget
  ProjectName: EntityFrameworkToolKit

jobs:
  create_nuget:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v3

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack ${{ env.ProjectName }} --configuration Release --output out

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3

    - name: Publish NuGet package
      run: dotnet nuget push ./ef-toolkit/out/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/wearemiew/index.json --skip-duplicate --no-symbols 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}